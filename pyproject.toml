[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cwdnet-turbulence"
version = "0.1.0"
description = "CWD-Net (CLEAR-Wiener-DATUM Network): Hybrid Physics-Driven & Deep Learning Atmospheric Turbulence Mitigation"
readme = "arquitetura.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "opencv-python>=4.8.0",
    "PyYAML>=6.0",
    "einops>=0.7.0",
    "tqdm>=4.65.0",
    "Pillow>=10.0.0",
    "tensorboard>=2.14.0",
    "lpips>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
