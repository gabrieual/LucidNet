# Ablation Variant C: DAAB + GRUM + DIM + MTCSA (Without Wiener Deconv & Without Twin Tilt Branch)
# Evaluates the impact of DATUM-inspired recurrent deformable registration and
# 8x8 windowed multi-head temporal-channel lucky fusion (MTCSA).
_base_: "../default.yaml"

experiment:
  name: "C_daab_mtcsa_no_wiener"

model:
  prior_extractor:
    name: "classical_full"
  alignment:
    name: "daab_grum_dim"
  fusion:
    name: "mtcsa"
  deconv:
    name: "identity_upsample"
  decoder:
    name: "single_naf_decoder"
    num_blocks_s2: 4
    num_blocks_s1: 6

loss:
  lambda_tilt: 0.0
  lambda_tv: 0.0
